[package]
name = "sspur-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["jit"]
jit = ["dep:blake3", "dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-native", "dep:libloading", "dep:sspur-smt"]

[dependencies]
blake3 = { workspace = true, optional = true }
cranelift-codegen = { version = "0.136.2", optional = true }
cranelift-frontend = { version = "0.136.2", optional = true }
cranelift-jit = { version = "0.136.2", optional = true }
cranelift-module = { version = "0.136.2", optional = true }
cranelift-native = { version = "0.136.2", optional = true }
libloading = { version = "0.9.0", optional = true }
sspur-syntax.workspace = true
sspur-check.workspace = true
sspur-smt = { workspace = true, optional = true }
